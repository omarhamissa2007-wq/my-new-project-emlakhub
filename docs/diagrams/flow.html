<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EmlakHub Flow</title>
<link rel="stylesheet" href="../assets/brand.css">
<style>
  html, body { margin: 0; background: var(--white); }
  .canvas { width: 1600px; height: 900px; }
  svg { display: block; }
  .chip { font: 700 13px var(--mono); letter-spacing: 0.12em; }
  .title { font: 600 25px var(--sans); fill: var(--ink); }
  .sub { font: 400 16px var(--mono); fill: var(--ink-soft); }
  .lane { font: 700 14px var(--mono); letter-spacing: 0.16em; fill: var(--ink-soft); }
  .small { font: 500 15px var(--mono); fill: var(--ink-soft); }
  .row { font: 500 18px var(--sans); fill: var(--ink); }
  .row-code { font: 500 16px var(--mono); fill: var(--accent-dark); }
  .state { font: 700 22px var(--mono); }
</style>
</head>
<body>
<div class="canvas">
<svg width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#061730"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8E6C34"/>
    </marker>
  </defs>

  <!-- lane 1: the customer's screens -->
  <rect x="20" y="20" width="1560" height="470" rx="18" fill="#F7F5EF" stroke="rgba(6,23,48,0.10)" stroke-width="2"/>
  <text x="48" y="58" class="lane">CUSTOMER · FROM BROWSING TO A SIGNED CONTRACT</text>

  <g>
    <rect x="50" y="90" width="330" height="120" rx="12" fill="#fff" stroke="#061730" stroke-width="2.5"/>
    <rect x="70" y="106" width="86" height="24" rx="5" fill="none" stroke="#3A4A63" stroke-width="1.5"/>
    <text x="113" y="123" class="chip" fill="#3A4A63" text-anchor="middle">SCREEN</text>
    <text x="215" y="165" class="title" text-anchor="middle">Gallery</text>
    <text x="215" y="192" class="sub" text-anchor="middle">search · 4 filters</text>
  </g>
  <g>
    <rect x="440" y="90" width="330" height="120" rx="12" fill="#fff" stroke="#061730" stroke-width="2.5"/>
    <rect x="460" y="106" width="86" height="24" rx="5" fill="none" stroke="#3A4A63" stroke-width="1.5"/>
    <text x="503" y="123" class="chip" fill="#3A4A63" text-anchor="middle">SCREEN</text>
    <text x="605" y="165" class="title" text-anchor="middle">Property details</text>
    <text x="605" y="192" class="sub" text-anchor="middle">photos · price · badge</text>
  </g>
  <g>
    <rect x="830" y="90" width="330" height="120" rx="12" fill="#F8F0DE" stroke="#C29A55" stroke-width="3"/>
    <rect x="850" y="106" width="86" height="24" rx="5" fill="#C29A55"/>
    <text x="893" y="123" class="chip" fill="#fff" text-anchor="middle">ACTION</text>
    <text x="995" y="165" class="title" text-anchor="middle">Sign a contract</text>
    <text x="995" y="192" class="sub" text-anchor="middle">card · signed PDF</text>
  </g>
  <g>
    <rect x="1220" y="90" width="330" height="120" rx="12" fill="#fff" stroke="#061730" stroke-width="2.5"/>
    <rect x="1240" y="106" width="86" height="24" rx="5" fill="none" stroke="#3A4A63" stroke-width="1.5"/>
    <text x="1283" y="123" class="chip" fill="#3A4A63" text-anchor="middle">SCREEN</text>
    <text x="1385" y="165" class="title" text-anchor="middle">My contracts</text>
    <text x="1385" y="192" class="sub" text-anchor="middle">status of each</text>
  </g>

  <line x1="382" y1="150" x2="436" y2="150" stroke="#061730" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="772" y1="150" x2="826" y2="150" stroke="#061730" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1162" y1="150" x2="1216" y2="150" stroke="#061730" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="409" y="80" class="small" text-anchor="middle">View details</text>
  <text x="799" y="80" class="small" text-anchor="middle">logged in</text>

  <!-- who gets the Sign button, under details -->
  <rect x="440" y="260" width="330" height="200" rx="12" fill="#fff" stroke="rgba(6,23,48,0.25)" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="460" y="292" class="lane">NO SIGN BUTTON FOR</text>
  <text x="460" y="330" class="row">Guest</text>
  <text x="750" y="330" class="row-code" text-anchor="end">log in first</text>
  <text x="460" y="365" class="row">Admin</text>
  <text x="750" y="365" class="row-code" text-anchor="end">runs the shop</text>
  <text x="460" y="400" class="row">Already applied</text>
  <text x="750" y="400" class="row-code" text-anchor="end">waits</text>
  <text x="460" y="435" class="row">Sold or rented</text>
  <text x="750" y="435" class="row-code" text-anchor="end">badge only</text>
  <line x1="605" y1="212" x2="605" y2="256" stroke="#3A4A63" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>

  <!-- what signing saves, under the action -->
  <rect x="830" y="260" width="720" height="200" rx="12" fill="#fff" stroke="#C29A55" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="850" y="292" class="lane">WHAT SIGNING SAVES</text>
  <text x="850" y="330" class="row">1  the contract, status pending</text>
  <text x="1530" y="330" class="row-code" text-anchor="end">contracts</text>
  <text x="850" y="365" class="row">2  the signed PDF (5 MB at most)</text>
  <text x="1530" y="365" class="row-code" text-anchor="end">data/contracts/contract_&lt;id&gt;.pdf</text>
  <text x="850" y="400" class="row">3  the type, from the listing's offer</text>
  <text x="1530" y="400" class="row-code" text-anchor="end">sale → ownership · rent → tenant</text>
  <text x="850" y="438" class="small">name, phone and email come filled in from the account</text>
  <line x1="995" y1="212" x2="995" y2="256" stroke="#8E6C34" stroke-width="2.5" marker-end="url(#arrow-red)"/>

  <!-- lane 2: statuses -->
  <rect x="20" y="540" width="1560" height="340" rx="18" fill="#F7F5EF" stroke="rgba(6,23,48,0.10)" stroke-width="2"/>
  <text x="48" y="578" class="lane">CONTRACT STATUS</text>
  <text x="960" y="578" class="lane">LISTING STATUS</text>
  <line x1="900" y1="560" x2="900" y2="835" stroke="rgba(6,23,48,0.12)" stroke-width="2"/>

  <path d="M1190,460 V515 H230 V616" fill="none" stroke="#8E6C34" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-red)"/>
  <text x="700" y="507" class="small" text-anchor="middle" fill="#8E6C34">every new contract starts here</text>

  <rect x="100" y="620" width="260" height="70" rx="35" fill="#FBF3E2" stroke="#BE9E63" stroke-width="3"/>
  <text x="230" y="663" class="state" fill="#8A6420" text-anchor="middle">pending</text>
  <rect x="520" y="620" width="260" height="70" rx="35" fill="#E9F7EE" stroke="#1E8E4E" stroke-width="3"/>
  <text x="650" y="663" class="state" fill="#16673A" text-anchor="middle">approved</text>
  <rect x="520" y="770" width="260" height="70" rx="35" fill="#F6F3EC" stroke="#3A4A63" stroke-width="3"/>
  <text x="650" y="813" class="state" fill="#3A4A63" text-anchor="middle">rejected</text>
  <line x1="362" y1="655" x2="516" y2="655" stroke="#061730" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="439" y="640" class="small" text-anchor="middle">Approve</text>
  <path d="M230,692 V805 H516" fill="none" stroke="#3A4A63" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="250" y="790" class="small">Reject</text>
  <line x1="650" y1="692" x2="650" y2="766" stroke="#3A4A63" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <text x="664" y="736" class="small">everyone else waiting</text>

  <rect x="960" y="770" width="260" height="70" rx="35" fill="#fff" stroke="#061730" stroke-width="3"/>
  <text x="1090" y="813" class="state" fill="#061730" text-anchor="middle">available</text>
  <rect x="1290" y="620" width="260" height="70" rx="35" fill="#F8F0DE" stroke="#C29A55" stroke-width="3"/>
  <text x="1420" y="663" class="state" fill="#8E6C34" text-anchor="middle">sold · rented</text>
  <line x1="782" y1="655" x2="1286" y2="655" stroke="#8E6C34" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-red)"/>
  <text x="1090" y="640" class="small" text-anchor="middle" fill="#8E6C34">approving marks the listing</text>
  <path d="M1420,692 V805 H1224" fill="none" stroke="#061730" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1240" y="832" class="small">Mark available again</text>
  <text x="960" y="745" class="small">every listing starts here</text>

  <text x="48" y="860" class="small">The admin answers on “All contracts”. Only a contract that is still pending can be approved or rejected.</text>
</svg>
</div>
</body>
</html>
